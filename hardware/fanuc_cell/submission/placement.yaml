# Where the objects go in each rollout, and what your policy is told. Sent with: uv run run.py --submit
#
# Leave it empty only if your task uses our default scene: 8 screws and the yellow bin (as in the twin), the same
# every rollout. For any other objects or layout, fill it in:
#   - objects and layout "same" in submission.yaml: one entry, used for every rollout;
#   - objects or layout "different": one entry per rollout, as many as "rollouts" (10 by default).
# Positions: x, y in mm in the robot frame (the same x, y as obs["tcp_pose"]), and an optional yaw in degrees;
# table_plan.png shows the axes and the table. A screw's position is its head, and its yaw points to its tip.
# Several objects of one kind: a list of positions, e.g. screw: [[420, -100, 30], [380, 50, 90]]
#
# rollouts:
#   - objects:                                     # rollout 1
#       cube: [420, -100, 30]
#       bin: [510, 110]
#     prompt: Put the cube into the yellow bin.    # optional; default: task in submission.yaml
#   - objects:                                     # rollout 2
#       cube: [380, 50, 90]
#       bin: [480, -150]
#   ...                                            # up to rollout 10

# DRAFT OLDER SCENE: do not submit this unchanged. Confirm with the organizers
# that `cube` and `bin` are accepted labels. Both lists are ordered red, yellow,
# blue. These positions are the shared layout in config/colour_bucket_sort.json,
# converted from metres to UF0 millimetres, and describe 10 mm cubes plus three
# physical bins. For a no-bucket virtual-table run, remove the bin objects only
# after organizer approval and make submission.yaml/task/prompt state the
# measured 10/16 mm cube profile and fixed virtual destinations. A future screw
# run needs a separate approved placement and a completed screw execution path;
# leaving this file empty selects the official default screw scene but does not
# make the current cube policy screw-capable.
rollouts:
  - objects:
      cube:
        - [440, -190, 0]   # red cube
        - [440, 0, 22]     # yellow cube
        - [440, 190, -28]  # blue cube
      bin:
        - [240, -190]      # red bin
        - [240, 0]         # yellow bin
        - [240, 190]       # blue bin
    prompt: Sort the red, yellow, and blue 10 mm cubes into their matching bins.
